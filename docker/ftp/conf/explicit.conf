# ==== Profil « explicit » : FTPS EXPLICITE (service ftps-secure) ====
# Le client se connecte en clair sur TCP/21 puis demande « AUTH TLS ».
listen_port=21
ftpd_banner=Serveur FTPS explicite du laboratoire (AUTH TLS obligatoire)
anonymous_enable=NO

ssl_enable=YES
rsa_cert_file=/etc/vsftpd-tls/ftps.crt
rsa_private_key_file=/etc/vsftpd-tls/ftps.key
# PROTECTIONS : authentification ET canal de données obligatoirement chiffrés.
force_local_logins_ssl=YES
force_local_data_ssl=YES
# Versions de TLS : seules TLS 1.2 et TLS 1.3 sont acceptées.
# Attention : le paquet vsftpd 3.0.5 d'Ubuntu 24.04 nomme ces options
# ssl_tlsv11 / ssl_tlsv12 / ssl_tlsv13 (sans second « _ »), alors que sa
# page de manuel indique ssl_tlsv1_1... Une option inconnue empêche vsftpd
# de démarrer (code de sortie 2, sans message).
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv11=NO
ssl_tlsv12=YES
ssl_tlsv13=YES
# Suites TLS 1.2 robustes uniquement (les suites TLS 1.3 sont toutes sûres).
ssl_ciphers=ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!3DES:!RC4
# La bibliothèque Python ftplib ne sait pas réutiliser la session TLS du
# canal de contrôle sur le canal de données : on désactive donc cette
# exigence (voir la procédure, partie FTPS, pour la discussion de sécurité).
require_ssl_reuse=NO

pasv_min_port=30000
pasv_max_port=30009
