# ---- Paramètres communs aux trois profils vsftpd du laboratoire ----
# Mode autonome, au premier plan (indispensable dans un conteneur).
listen=YES
listen_ipv6=NO
background=NO

# Comptes locaux (stagiaire) autorisés, avec droit d'écriture.
local_enable=YES
write_enable=YES
local_umask=022
# Chaque utilisateur est enfermé (chroot) dans son répertoire personnel.
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd

# Mode actif : connexion de données ouverte par le serveur depuis le port 20.
port_enable=YES
connect_from_port_20=YES
# Mode passif : le serveur ouvre un port d'écoute dans une plage limitée.
pasv_enable=YES

# Après 3 échecs d'authentification, la session est coupée.
max_login_fails=3
# Délais réduits pour les manipulations de pare-feu (valeurs par défaut : 60 s).
connect_timeout=10
accept_timeout=15
# Réglages nécessaires dans un conteneur non privilégié.
seccomp_sandbox=NO
isolate=NO
isolate_network=NO

# Journalisation : protocole FTP complet (le mot de passe est masqué
# par vsftpd) + transferts. Le fichier est recopié vers « docker logs » par entrypoint.sh.
xferlog_enable=YES
log_ftp_protocol=YES
dual_log_enable=YES
vsftpd_log_file=/var/log/vsftpd.log
xferlog_file=/var/log/vsftpd.log
