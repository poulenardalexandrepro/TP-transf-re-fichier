# ==== Profil « implicit » : FTPS IMPLICITE (service ftps-implicit) ====
# TLS est négocié IMMÉDIATEMENT après la connexion TCP sur le port 990 :
# aucune commande AUTH TLS, rien ne circule en clair.
listen_port=990
implicit_ssl=YES
ftpd_banner=Serveur FTPS implicite du laboratoire (TLS des la connexion)
anonymous_enable=NO

ssl_enable=YES
rsa_cert_file=/etc/vsftpd-tls/ftps.crt
rsa_private_key_file=/etc/vsftpd-tls/ftps.key
force_local_logins_ssl=YES
force_local_data_ssl=YES
# Versions de TLS : seules TLS 1.2 et TLS 1.3 sont acceptées.
# Attention : le paquet vsftpd 3.0.5 d'Ubuntu 24.04 nomme ces options
# ssl_tlsv11 / ssl_tlsv12 / ssl_tlsv13 (sans second « _ »), alors que sa
# page de manuel indique ssl_tlsv1_1... Une option inconnue empêche vsftpd
# de démarrer (code de sortie 2, sans message).
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=NO
ssl_tlsv11=NO
ssl_tlsv12=YES
ssl_tlsv13=YES
ssl_ciphers=ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!3DES:!RC4
require_ssl_reuse=NO

pasv_min_port=30100
pasv_max_port=30109
