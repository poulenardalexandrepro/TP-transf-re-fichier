# ==== Profil « plain » : FTP NON CHIFFRÉ (service ftp-plain) ====
# VULNÉRABILITÉS VOLONTAIRES :
#  - aucun chiffrement (ssl_enable=NO) : identifiants, commandes et
#    fichiers circulent en clair ;
#  - accès anonyme en lecture (anonymous_enable=YES).
listen_port=21
ftpd_banner=Serveur FTP du laboratoire (NON CHIFFRE)
ssl_enable=NO

anonymous_enable=YES
anon_root=/srv/ftp/public
no_anon_password=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO

pasv_min_port=30000
pasv_max_port=30009
