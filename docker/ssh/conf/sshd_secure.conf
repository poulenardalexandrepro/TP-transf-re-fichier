# ==== Profil « secure » : SSH DURCI (service ssh-secure) ====
Port 22
AddressFamily inet
# Clé d'hôte unique (Ed25519), générée au premier démarrage.
HostKey /var/lib/lab-hostkeys/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519

# Authentification : clé publique UNIQUEMENT.
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthorizedKeysFile .ssh/authorized_keys
# Liste blanche des comptes autorisés.
AllowUsers stagiaire depot
# Limitation des tentatives et du temps accordé pour s'authentifier.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 5:50:10
# Vérification stricte des permissions des fichiers de l'utilisateur.
StrictModes yes

# Algorithmes modernes uniquement.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

# Aucune redirection : réduit la surface d'attaque.
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
UsePAM yes
PrintMotd no

# Supervision : journalisation détaillée (empreinte des clés utilisées).
LogLevel VERBOSE
Subsystem sftp internal-sftp -l INFO

# Compte « depot » : SFTP uniquement, enfermé dans /srv/sftp-depot.
Match User depot
    ChrootDirectory /srv/sftp-depot
    ForceCommand internal-sftp -l INFO
    PermitTTY no
