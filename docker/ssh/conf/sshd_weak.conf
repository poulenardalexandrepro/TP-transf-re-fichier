# ==== Profil « weak » : SSH À CONFIGURATION FAIBLE (service ssh-weak) ====
# VULNÉRABILITÉS VOLONTAIRES (à ne JAMAIS reproduire en production) :
#  - connexion de root autorisée avec mot de passe ;
#  - authentification par mot de passe autorisée (mots de passe faibles) ;
#  - 10 essais de mot de passe par connexion ;
#  - StrictModes désactivé : sshd accepte des fichiers de clés mal protégés ;
#  - redirections (X11, TCP, agent) autorisées ;
#  - journalisation désactivée (LogLevel QUIET) : aucune supervision.
Port 22
AddressFamily inet
HostKey /var/lib/lab-hostkeys/ssh_host_ed25519_key
HostKey /var/lib/lab-hostkeys/ssh_host_ecdsa_key
HostKey /var/lib/lab-hostkeys/ssh_host_rsa_key
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PermitEmptyPasswords no
MaxAuthTries 10
LoginGraceTime 120
StrictModes no
X11Forwarding yes
AllowTcpForwarding yes
AllowAgentForwarding yes
UsePAM yes
PrintMotd no
LogLevel QUIET
Subsystem sftp internal-sftp
