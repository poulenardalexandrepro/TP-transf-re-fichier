# ==== Profil « impostor » : SERVEUR IMPOSTEUR (service ssh-impostor) ====
# Il imite ssh-secure (même compte « stagiaire ») mais possède une clé
# d'hôte DIFFÉRENTE. Il accepte les mots de passe pour pouvoir les
# intercepter (module PAM pam_exec, voir capture_mdp.sh).
Port 22
AddressFamily inet
HostKey /var/lib/lab-hostkeys/ssh_host_ed25519_key
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
UsePAM yes
PrintMotd no
LogLevel INFO
Subsystem sftp internal-sftp
